{% extends "base.html" %}

{% block content %}
<div class="glass-panel auth-card fade-in">
    <div class="auth-icon purple">
        <i class="fas fa-fingerprint"></i>
    </div>

    <h2 class="auth-title">Welcome Back</h2>
    <p class="text-muted mb-2 auth-subtitle">Sign in to access the detection dashboard</p>

    <form method="POST">
        <div class="mb-2">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
        </div>
        <div class="mb-2 input-with-action">
            <input type="password" name="password" id="passwordField" placeholder="Password (8–12 characters)" required
                minlength="8" maxlength="12" class="input-has-action">
            <button type="button" id="togglePassword" class="input-action-btn">
                <i class="fas fa-eye" id="toggleIcon"></i>
            </button>
        </div>
        <button type="submit" class="btn btn-block">
            <i class="fas fa-right-to-bracket"></i> Sign In
        </button>
    </form>

    <div class="mt-2 auth-link-wrap">
        <a href="{{ url_for('register') }}" class="auth-link">
            Don't have an account? <span class="gradient-text" style="font-weight: 600;">Create one</span>
        </a>
    </div>
</div>

<script>
    const toggleBtn = document.getElementById('togglePassword');
    const pf = document.getElementById('passwordField');
    const ti = document.getElementById('toggleIcon');
    toggleBtn.addEventListener('click', () => {
        if (pf.type === 'password') { pf.type = 'text'; ti.classList.replace('fa-eye', 'fa-eye-slash'); toggleBtn.classList.add('active'); }
        else { pf.type = 'password'; ti.classList.replace('fa-eye-slash', 'fa-eye'); toggleBtn.classList.remove('active'); }
    });
</script>
{% endblock %}
